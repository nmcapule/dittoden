<!DOCTYPE html>
<html>
<head>
	<title>Dittoden - Entities</title>
	<style>
		body { font-family: sans-serif; margin: 20px; }
		table { border-collapse: collapse; width: 100%; }
		th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
		th { background-color: #f2f2f2; }
		tr:hover { background-color: #f5f5f5; cursor: pointer; }
	</style>
</head>
<body>
	<h1>Entities</h1>
	<table>
		<thead>
			<tr>
				<th>Code</th>
				<th>Primary Label</th>
				<th>Type</th>
			</tr>
		</thead>
		<tbody>
			{{range .}}
			<tr onclick="window.location='/entity/{{.Code}}'">
				<td>{{.Code}}</td>
				<td>{{getPrimaryLabel .}}</td>
				<td>{{.Type}}</td>
			</tr>
			{{end}}
		</tbody>
	</table>
	<script>
		// Helper for template function in JS context if needed, though handled in Go
	</script>
</body>
</html>
